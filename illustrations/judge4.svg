<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <title>제4관 오관왕</title>
  <rect width="320" height="80" fill="#1b1815"/>
  <rect width="320" height="3" fill="#14110e"/>
  <!-- 다섯 창구: 양옆에 넷, 가운데가 대왕 자리. 창구 안은 불이 켜져 있다 -->
  <g fill="#0d0b09"><rect x="33" y="12" width="32" height="32"/><rect x="72" y="12" width="32" height="32"/><rect x="216" y="12" width="32" height="32"/><rect x="255" y="12" width="32" height="32"/></g>
  <g fill="#26211c"><rect x="35.5" y="14.5" width="27" height="23"/><rect x="74.5" y="14.5" width="27" height="23"/><rect x="218.5" y="14.5" width="27" height="23"/><rect x="257.5" y="14.5" width="27" height="23"/></g>
  <!-- 창구 직원: 1·4번은 앞을 보고, 5번은 고개를 숙여 적는다 -->
  <g fill="#0d0b09"><circle cx="49" cy="27" r="3.4"/><path d="M40.5 37.5 Q41.5 31.4 49 31 Q56.5 31.4 57.5 37.5 Z"/><circle cx="232" cy="27" r="3.4"/><path d="M223.5 37.5 Q224.5 31.4 232 31 Q239.5 31.4 240.5 37.5 Z"/><circle cx="272.5" cy="30" r="3.4"/><path d="M262.5 37.5 Q264 33.4 272 33 Q279 33.4 279.5 37.5 Z"/></g>
  <!-- 발: 2번 창구는 거의 다 내렸다 -->
  <g fill="#3a342c"><rect x="35.5" y="14.5" width="27" height="7"/><rect x="74.5" y="14.5" width="27" height="16"/><rect x="218.5" y="14.5" width="27" height="7"/><rect x="257.5" y="14.5" width="27" height="7"/></g>
  <g stroke="#2b2620" stroke-width="0.6"><path d="M35.5 16.5 H62.5"/><path d="M35.5 18.5 H62.5"/><path d="M35.5 20.5 H62.5"/><path d="M74.5 16.5 H101.5"/><path d="M74.5 18.5 H101.5"/><path d="M74.5 20.5 H101.5"/><path d="M74.5 22.5 H101.5"/><path d="M74.5 24.5 H101.5"/><path d="M74.5 26.5 H101.5"/><path d="M74.5 28.5 H101.5"/><path d="M218.5 16.5 H245.5"/><path d="M218.5 18.5 H245.5"/><path d="M218.5 20.5 H245.5"/><path d="M257.5 16.5 H284.5"/><path d="M257.5 18.5 H284.5"/><path d="M257.5 20.5 H284.5"/></g>
  <!-- 서류를 받는 턱과 그 위에 놓인 서류 -->
  <g fill="#3a342c"><rect x="31" y="37.5" width="36" height="2"/><rect x="70" y="37.5" width="36" height="2"/><rect x="214" y="37.5" width="36" height="2"/><rect x="253" y="37.5" width="36" height="2"/></g>
  <g fill="#e8dcc0" opacity="0.5"><rect x="83" y="35.3" width="9" height="2.2"/><rect x="264" y="35.7" width="10" height="1.8"/></g>
  <!-- 번호 팻말: 점의 수가 창구 번호다 (가운데 대왕 자리가 셋째) -->
  <g stroke="#0d0b09" stroke-width="0.6"><path d="M44 3 V5 M54 3 V5"/><path d="M83 3 V5 M93 3 V5"/><path d="M227 3 V5 M237 3 V5"/><path d="M266 3 V5 M276 3 V5"/></g>
  <g fill="#e8dcc0" opacity="0.28"><rect x="41" y="5" width="16" height="4.4"/><rect x="80" y="5" width="16" height="4.4"/><rect x="224" y="5" width="16" height="4.4"/><rect x="263" y="5" width="16" height="4.4"/></g>
  <g fill="#0d0b09"><circle cx="49" cy="7.2" r="0.75"/><circle cx="86.7" cy="7.2" r="0.75"/><circle cx="89.3" cy="7.2" r="0.75"/><circle cx="228.1" cy="7.2" r="0.75"/><circle cx="230.7" cy="7.2" r="0.75"/><circle cx="233.3" cy="7.2" r="0.75"/><circle cx="235.9" cy="7.2" r="0.75"/><circle cx="265.8" cy="7.2" r="0.75"/><circle cx="268.4" cy="7.2" r="0.75"/><circle cx="271" cy="7.2" r="0.75"/><circle cx="273.6" cy="7.2" r="0.75"/><circle cx="276.2" cy="7.2" r="0.75"/></g>
  <!-- 가운데 다섯째 창구: 대왕 자리 -->
  <rect x="111" y="3" width="98" height="49" fill="#0d0b09"/>
  <rect x="114" y="6" width="92" height="46" fill="#26211c"/>
  <!-- 업칭: 대왕 뒤에 선 큰 저울. A자 다리가 왕의 어깨 뒤로 내려가 책상까지 닿는다.
       말을 적은 쪽지 한 장을 올린 왼쪽 접시가 쇠 추를 올린 오른쪽보다 무겁다. 두 접시는 대왕 칸 안에 든다 -->
  <g fill="none" stroke="#a89c84" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M160 9.6 L121.5 50"/><path d="M160 9.6 L198.5 50"/>
  </g>
  <g fill="#a89c84" opacity="0.8">
    <rect x="158.8" y="9.4" width="2.4" height="16"/>
    <path d="M160 4.6 L162.2 7.6 L160 10.2 L157.8 7.6 Z"/>
    <path d="M124 12.5 L160 9.1 L196 5.7 L196 7.1 L160 10.5 L124 13.9 Z"/>
    <circle cx="124" cy="13.2" r="1.1"/><circle cx="196" cy="6.4" r="1.1"/>
  </g>
  <g fill="none" stroke="#a89c84" stroke-width="0.6" opacity="0.75">
    <path d="M124 13.8 L115.4 39 M124 13.8 L132.6 39 M124 13.8 V39"/>
    <path d="M196 7 L187.4 31 M196 7 L204.6 31 M196 7 V31"/>
  </g>
  <g fill="#a89c84" opacity="0.8">
    <path d="M115 39 L133 39 Q131.4 43 124 43 Q116.6 43 115 39 Z"/>
    <path d="M187 31 L205 31 Q203.4 35 196 35 Q188.6 35 187 31 Z"/>
  </g>
  <!-- 왼쪽 접시: 말을 적은 쪽지 한 장 -->
  <path d="M117.4 39 L118.2 34.8 L129.8 34.8 L130.6 39 Z" fill="#e8dcc0" opacity="0.9"/>
  <g stroke="#3a342c" stroke-width="0.6" stroke-linecap="round"><path d="M120.6 36 V38"/><path d="M123 36 V37.4"/><path d="M125.4 36 V38"/><path d="M127.8 36 V37"/></g>
  <!-- 오른쪽 접시: 쇠 추 -->
  <path d="M191.6 31 L192.9 26.6 L199.1 26.6 L200.4 31 Z" fill="#0d0b09" stroke="#5a5246" stroke-width="0.5"/>
  <circle cx="196" cy="25.4" r="1.1" fill="none" stroke="#5a5246" stroke-width="0.6"/>
  <!-- 오관왕: 면류관과 넓은 관복. 소매를 모으고 저울 앞에 앉았다 -->
  <path d="M128 52 Q132 36 160 35 Q188 36 192 52 Z" fill="#0d0b09"/>
  <circle cx="160" cy="28" r="6.6" fill="#0d0b09"/>
  <path d="M147.5 16.4 L172.5 16.4 L175 20.4 L145 20.4 Z" fill="#0d0b09"/>
  <rect x="155" y="19.8" width="10" height="3.6" fill="#0d0b09"/>
  <g stroke="#0d0b09" stroke-width="0.8"><path d="M146.2 20.4 V25.2"/><path d="M149.8 20.4 V26.4"/><path d="M170.2 20.4 V26.4"/><path d="M173.8 20.4 V25.2"/></g>
  <path d="M137 43 Q125 46 125 52 L160 52 Q157 46.4 146 45 Z" fill="#0d0b09"/>
  <path d="M183 43 Q195 46 195 52 L160 52 Q163 46.4 174 45 Z" fill="#0d0b09"/>
  <!-- 책상 -->
  <rect x="24" y="50" width="272" height="30" fill="#0d0b09"/>
  <rect x="24" y="50" width="272" height="2" fill="#3a342c"/>
  <!-- 크기대로 늘어놓은 추 다섯 -->
  <rect x="132" y="55" width="56" height="9" rx="1" fill="#14110e" stroke="#3a342c" stroke-width="1"/>
  <g fill="#a89c84" opacity="0.55">
    <path d="M136 62.6 L137.6 56.6 L144.4 56.6 L146 62.6 Z"/>
    <path d="M149 62.6 L150.4 57.6 L155.6 57.6 L157 62.6 Z"/>
    <path d="M160 62.6 L161.2 58.6 L165.2 58.6 L166.4 62.6 Z"/>
    <path d="M169.4 62.6 L170.4 59.4 L173.4 59.4 L174.4 62.6 Z"/>
    <path d="M177.4 62.6 L178.2 60.2 L180.4 60.2 L181.2 62.6 Z"/>
  </g>
  <!-- 낙관 -->
  <rect x="294" y="6" width="18" height="18" rx="2.5" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <text x="303" y="19" text-anchor="middle" font-size="11" fill="#c0392b" font-family="serif">秤</text>
</svg>
