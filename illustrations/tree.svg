<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <title>옷 거는 나무</title>
  <!-- 가로로 긴 띠 그림(4:1). 아래쪽 1/3쯤에는 사건 제목 글씨가 겹치므로 잔잔한 물만 둔다 -->
  <!-- 하늘 -->
  <rect width="320" height="80" fill="#1b1815"/>
  <!-- 먼 산 두 겹 -->
  <path d="M0 22 Q40 10 84 18 Q128 6 174 16 Q220 8 262 15 Q296 9 320 14 L320 42 L0 42 Z" fill="#2b2620"/>
  <path d="M0 30 Q64 21 128 28 Q192 19 254 27 Q292 22 320 26 L320 42 L0 42 Z" fill="#332d26"/>
  <!-- 강가 안개 -->
  <ellipse cx="70" cy="35" rx="110" ry="2.6" fill="#4a4338" opacity="0.55"/>
  <ellipse cx="280" cy="38" rx="90" ry="2.4" fill="#4a4338" opacity="0.5"/>
  <!-- 강물 -->
  <rect y="39" width="320" height="41" fill="#201c18"/>
  <!-- 왼편 둑길: 나무 밑동까지 이어진다 -->
  <path d="M0 37 Q60 35.5 120 37.2 Q180 38.6 226 38.4 Q244 38.6 250 42 Q246 44.6 228 45 Q170 45.8 110 45.4 Q50 45 0 46 Z" fill="#2b2620"/>
  <path d="M0 46 Q50 45 110 45.4 Q170 45.8 228 45 Q246 44.6 250 42" fill="none" stroke="#14110e" stroke-width="0.8"/>
  <g stroke="#5a5246" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <path d="M28 49 H62"/><path d="M118 48.5 H150"/><path d="M276 44 H306"/><path d="M262 48 H286"/>
  </g>
  <!-- 아래쪽 잔물결은 아주 옅게 (제목 글씨 자리) -->
  <g stroke="#5a5246" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <path d="M64 60 H104"/><path d="M226 63 H272"/><path d="M150 72 H190"/>
  </g>
  <!-- 가지에 걸린 망자들의 겉옷 (가지는 옷 무게만큼 휜다) -->
  <g fill="#a89c84" opacity="0.72">
    <path d="M177.8 15.7 Q182 14.6 186.2 15.7 L189.4 17 L189.6 23.3 L186.6 23.1 L187.5 29.5 L176.5 29.5 L177.4 23.1 L174.4 23.3 L174.6 17 Z"/>
    <path d="M153 16.9 Q157 15.8 161 16.9 L164 18 L164.2 24 L161.3 23.8 L162.2 29.9 L151.8 29.9 L152.7 23.8 L149.8 24 L150 18 Z"/>
    <path d="M232 9 Q236 7.9 240 9 L243 10.2 L243.2 16.1 L240.3 15.9 L241.2 22.1 L230.8 22.1 L231.7 15.9 L228.8 16.1 L229 10.2 Z"/>
    <path d="M272.3 10.9 Q276 9.9 279.7 10.9 L282.6 12 L282.8 17.6 L280.1 17.4 L280.9 23.2 L271.1 23.2 L271.9 17.4 L269.2 17.6 L269.4 12 Z"/>
  </g>
  <g fill="none" stroke="#1b1815" stroke-width="0.6" opacity="0.8">
    <path d="M180.4 15.5 L182 18.1 L183.6 15.5 M182 18.1 V29.5"/>
    <path d="M155.5 16.6 L157 19.1 L158.5 16.6 M157 19.1 V29.9"/>
    <path d="M234.5 8.7 L236 11.3 L237.5 8.7 M236 11.3 V22.1"/>
    <path d="M274.6 10.6 L276 13 L277.4 10.6 M276 13 V23.2"/>
  </g>
  <!-- 가장 무거운 옷: 가지 끝이 물에 닿을 듯 휜다. 옷자락 아래쪽이 어둡다 (옷은 말랐고 무게만 남았다. 이야기 대장 5.2 ②) -->
  <path d="M252.2 32.3 Q257 31 261.8 32.3 L265.6 33.7 L265.8 41 L262.3 40.8 L263.4 48.3 L250.6 48.3 L251.7 40.8 L248.2 41 L248.4 33.7 Z" fill="#a89c84" opacity="0.72"/>
  <path d="M251.1 44.7 L262.9 44.7 L263.4 48.3 L250.6 48.3 Z" fill="#5a5246" opacity="0.9"/>
  <path d="M255.1 32 L257 35.1 L258.9 32 M257 35.1 V48.3" fill="none" stroke="#1b1815" stroke-width="0.6" opacity="0.8"/>
  <circle cx="255" cy="50" r="0.5" fill="#5a5246"/>
  <ellipse cx="268" cy="46.6" rx="4" ry="0.7" fill="none" stroke="#5a5246" stroke-width="0.6" opacity="0.8"/>
  <!-- 고목: 굵은 줄기와 옆으로 뻗은 가지 -->
  <g fill="#0d0b09">
    <path d="M193 45.8 Q200 44.4 200.4 37 Q201.6 28 200.6 17.6 L209.6 16.6 Q210.2 27 212.6 36 Q213.6 43.6 221 45.8 Z"/>
    <path d="M204.8 20.1 Q184.2 12.4 163.9 14.8 L164.1 17.2 Q183.8 15.6 203.2 23.9 Z M163.9 14.8 Q147.7 17.4 139.8 26.8 L140.2 27.2 Q148.3 18.6 164.1 17.2 Z"/>
    <path d="M210.3 29.1 Q235.9 24.6 251.5 31.1 L252.5 28.9 Q236.1 21.4 209.7 24.9 Z M251.5 31.1 Q263.5 36.5 267.8 45.1 L268.2 44.9 Q264.5 35.5 252.5 28.9 Z"/>
    <path d="M209.6 18.6 Q236.2 7.3 261.9 10 L262.1 8 Q235.8 4.7 208.4 15.4 Z M261.9 10 Q281.8 11.6 291.9 18.2 L292.1 17.8 Q282.2 10.4 262.1 8 Z"/>
    <!-- 아무것도 걸리지 않아 곧은 가지 (빈 옷은 삯이 없다) -->
    <path d="M205.5 15.8 Q189.8 9.3 174.1 2.8 L173.9 3.2 Q189.2 10.7 204.5 18.2 Z"/>
  </g>
  <ellipse cx="205.6" cy="31" rx="0.9" ry="1.8" fill="#26211c"/>
  <g fill="none" stroke="#0d0b09" stroke-width="0.8" stroke-linecap="round">
    <path d="M168 15.8 L164.5 10.5"/><path d="M226 24 L231 19.5"/><path d="M249 7.6 L252.5 2.8"/><path d="M190 10.4 L187.6 6"/>
  </g>
  <!-- 밑동 곁의 할멈: 등이 굽고, 펼친 장부를 들었다 -->
  <g fill="#0d0b09">
    <path d="M181.5 45 L182.2 38.6 Q182.6 34.4 186.4 33.6 Q190 34 190.4 38.4 L191.2 45 Z"/>
    <circle cx="180.6" cy="35.4" r="2.1"/><circle cx="182.1" cy="33.4" r="0.9"/>
    <path d="M181.4 36.8 L178.6 38.4 L179.4 39.6 L183 38.6 Z"/>
  </g>
  <path d="M173.6 37.4 L176 36.8 L178.4 37.4 L178.4 40.2 L176 39.6 L173.6 40.2 Z" fill="#e8dcc0" opacity="0.7"/>
  <!-- 둑길에 줄을 선 망자 둘: 벗은 겉옷을 팔에 걸었다 -->
  <circle cx="118" cy="30.6" r="2.2" fill="#a89c84" opacity="0.75"/>
  <path d="M115.3 33.9 Q118 32 120.7 33.9 L122 43.6 L114 43.6 Z" fill="#a89c84" opacity="0.75"/>
  <path d="M119.4 36 L123.2 36.4 L122.8 41.4 L120 41 Z" fill="#e8dcc0" opacity="0.45"/>
  <circle cx="136" cy="30.6" r="2.2" fill="#a89c84" opacity="0.75"/>
  <path d="M133.3 33.9 Q136 32 138.7 33.9 L140 43.6 L132 43.6 Z" fill="#a89c84" opacity="0.75"/>
  <path d="M137.4 36 L141.2 36.4 L140.8 41.4 L138 41 Z" fill="#e8dcc0" opacity="0.45"/>
  <!-- 낙관 -->
  <rect x="8" y="6" width="18" height="18" rx="2.5" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <text x="17" y="19" text-anchor="middle" font-size="11" fill="#c0392b" font-family="serif">衣</text>
</svg>
