<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140">
  <title>제1관 진광왕</title>
  <rect width="320" height="140" fill="#1b1815"/>
  <!-- 뒤쪽 병풍 (산수화가 그려진 네 폭) -->
  <g fill="#26211c" stroke="#3a342c" stroke-width="1">
    <rect x="60" y="14" width="50" height="84"/><rect x="110" y="14" width="50" height="84"/>
    <rect x="160" y="14" width="50" height="84"/><rect x="210" y="14" width="50" height="84"/>
  </g>
  <g fill="none" stroke="#3a342c" stroke-width="1.2" stroke-linecap="round">
    <path d="M66 70 Q78 52 90 64 Q98 56 106 66"/><path d="M216 66 Q228 50 240 62 Q248 54 256 64"/>
    <path d="M166 40 Q180 32 194 40"/>
  </g>
  <!-- 진광왕: 면류관, 얼굴, 넓은 관복 -->
  <path d="M120 98 Q128 70 160 68 Q192 70 200 98 Z" fill="#0d0b09"/>
  <circle cx="160" cy="56" r="11" fill="#0d0b09"/>
  <rect x="142" y="38" width="36" height="5" fill="#0d0b09"/>
  <rect x="152" y="42" width="16" height="6" fill="#0d0b09"/>
  <g stroke="#0d0b09" stroke-width="1"><path d="M144 43 V49"/><path d="M149 43 V50"/><path d="M171 43 V50"/><path d="M176 43 V49"/></g>
  <!-- 책상 -->
  <rect x="40" y="96" width="240" height="44" fill="#0d0b09"/>
  <rect x="40" y="96" width="240" height="3" fill="#3a342c"/>
  <!-- 산더미 같은 명부 -->
  <g fill="#e8dcc0" opacity="0.28">
    <rect x="52" y="78" width="40" height="5"/><rect x="54" y="72" width="36" height="5"/><rect x="50" y="84" width="44" height="5"/>
    <rect x="56" y="66" width="34" height="5"/><rect x="50" y="90" width="44" height="5"/>
    <rect x="228" y="82" width="40" height="5"/><rect x="230" y="76" width="36" height="5"/><rect x="226" y="88" width="44" height="7"/>
  </g>
  <!-- 펼친 명부와 붓 -->
  <path d="M136 104 L160 101 L184 104 L184 116 L160 113 L136 116 Z" fill="#e8dcc0" opacity="0.7"/>
  <path d="M160 101 V113" stroke="#a89c84" stroke-width="0.8"/>
  <path d="M190 112 L206 92" stroke="#a89c84" stroke-width="2" stroke-linecap="round"/>
  <!-- 붉은 도장 -->
  <rect x="108" y="104" width="10" height="10" fill="#c0392b"/>
  <!-- 낙관 (작은 화면에서 그림 위아래가 잘려도 보이도록 가운데 높이에 둔다) -->
  <rect x="284" y="40" width="24" height="24" rx="3" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="296" y="57" text-anchor="middle" font-size="13" fill="#c0392b" font-family="serif">審</text>
</svg>
