<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <title>저승 문 앞</title>
  <!-- 가로로 긴 띠 그림(4:1). 아래쪽 1/3쯤에는 사건 제목 글씨가 겹치므로 땅과 안개만 둔다 -->
  <rect width="320" height="80" fill="#1b1815"/>
  <!-- 먼 산 -->
  <path d="M0 32 Q40 16 86 26 Q132 10 182 24 Q226 12 270 22 Q298 16 320 22 L320 80 L0 80 Z" fill="#26211c"/>
  <!-- 땅 -->
  <path d="M0 48 Q160 44 320 48 L320 80 L0 80 Z" fill="#2b2620"/>
  <!-- 저승 문: 기둥, 문짝, 기와 지붕 -->
  <rect x="224.2" y="15.5" width="4.5" height="32.5" fill="#0d0b09"/>
  <rect x="271.3" y="15.5" width="4.5" height="32.5" fill="#0d0b09"/>
  <rect x="228.7" y="20" width="42.6" height="28" fill="#14110e"/>
  <path d="M250 20 V48" stroke="#2b2620" stroke-width="1"/>
  <rect x="222" y="15.5" width="56" height="2.8" fill="#0d0b09"/>
  <path d="M215.3 13.3 Q223.1 15.5 228.7 11 L271.3 11 Q276.9 15.5 284.7 13.3 L279.1 16.6 L220.9 16.6 Z" fill="#0d0b09"/>
  <path d="M228.7 11 Q250 4.3 271.3 11 Z" fill="#0d0b09"/>
  <!-- 현판 -->
  <rect x="243.3" y="12.2" width="13.4" height="3.9" fill="#2b2620"/>
  <!-- 붉은 등 두 개 -->
  <path d="M222 18.3 V22.7 M278 18.3 V22.7" stroke="#0d0b09" stroke-width="0.8"/>
  <circle cx="222" cy="25.5" r="6" fill="#c0392b" opacity="0.18"/>
  <circle cx="278" cy="25.5" r="6" fill="#c0392b" opacity="0.18"/>
  <ellipse cx="222" cy="25.5" rx="2.2" ry="2.8" fill="#c0392b"/>
  <ellipse cx="278" cy="25.5" rx="2.2" ry="2.8" fill="#c0392b"/>
  <!-- 문 앞의 당신 (흐릿한 망자) -->
  <circle cx="190" cy="34" r="2.3" fill="#a89c84" opacity="0.75"/>
  <path d="M187.4 37.3 Q190 35.3 192.6 37.3 L193.9 47 L186.1 47 Z" fill="#a89c84" opacity="0.75"/>
  <!-- 돌아서 떠나는 저승사자 (갓) -->
  <ellipse cx="66" cy="19.7" rx="8.5" ry="1.6" fill="#0d0b09"/>
  <path d="M62.8 19.7 Q62.8 14.5 66 13.9 Q69.2 14.5 69.2 19.7 Z" fill="#0d0b09"/>
  <circle cx="66" cy="23" r="2.6" fill="#0d0b09"/>
  <path d="M61.5 26.2 Q66 23.6 70.5 26.2 L73.8 47 L58.2 47 Z" fill="#0d0b09"/>
  <!-- 안개 -->
  <ellipse cx="60" cy="46.5" rx="80" ry="3" fill="#4a4338" opacity="0.55"/>
  <ellipse cx="250" cy="48.5" rx="90" ry="3" fill="#4a4338" opacity="0.5"/>
  <ellipse cx="130" cy="30" rx="40" ry="1.5" fill="#4a4338" opacity="0.35"/>
  <!-- 아래쪽에 깔린 옅은 안개 (제목 글씨 자리) -->
  <ellipse cx="160" cy="62" rx="170" ry="4" fill="#4a4338" opacity="0.25"/>
  <ellipse cx="110" cy="73" rx="130" ry="3" fill="#4a4338" opacity="0.18"/>
  <!-- 낙관 -->
  <rect x="8" y="6" width="18" height="18" rx="2.5" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <text x="17" y="19" text-anchor="middle" font-size="11" fill="#c0392b" font-family="serif">門</text>
</svg>
